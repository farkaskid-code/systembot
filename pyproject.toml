[project]
name = "systembot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "function-schema>=0.4.5",
    "ollama>=0.6.2",
    "openai>=3.24.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
systembot = "systembot.main:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"
